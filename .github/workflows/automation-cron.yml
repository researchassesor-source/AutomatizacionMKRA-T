name: Automatizacion (cron)

concurrency:
  group: crm-automation-production
  cancel-in-progress: false

# Respaldo manual de las tareas programadas del sistema:
#  - publicar los posts programados cuya hora ya llego
#  - enviar los correos/WhatsApp de nurture vencidos
#
# YA NO ES EL RELOJ DE PRODUCCION. El reloj es un schedule de QStash cada dos
# minutos contra /api/cron/tick, validado en produccion.
#
# Por que se retiro el `schedule:` de aqui: GitHub Actions no garantiza la
# puntualidad de los cron programados. Estaba declarado cada 5 minutos y en la
# practica corria cada 24 a 67, con una media de 39. Una publicacion de las
# 14:00 salio mas de 30 minutos tarde, y el mismo disparador alimenta el
# recordatorio de WhatsApp de 15 minutos antes de cada sesion, que con esa
# latencia puede llegar despues de empezar.
#
# El workflow se conserva a proposito: sigue sirviendo para desatascar la cola
# a mano desde la pestaña Actions si QStash fallara. Requiere el secreto de
# repositorio CRON_SECRET, el mismo valor que la variable en Vercel.

on:
  # Solo ejecucion manual. Reactivar el `schedule:` volveria a poner dos relojes
  # a la vez; no duplicaria envios —cada mensaje y cada publicacion se reclaman
  # con una escritura condicional— pero enmascararia si QStash dejara de correr.
  workflow_dispatch: {} # permite dispararlo a mano desde la pestana Actions

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRM_JOB_BASE_URL: https://automatizacion-mkra-t2.vercel.app
    steps:
      - name: Verificar rama operativa del repositorio
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "El cron debe residir en la rama predeterminada main; actual: $DEFAULT_BRANCH"
            exit 1
          fi
      - name: Publicar posts programados
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 45 \
            -X GET "$CRM_JOB_BASE_URL/api/social/publish" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "X-CRM-Cron-Contract: 2026-08-v2"
      - name: Enviar nurture pendiente
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 45 \
            -X GET "$CRM_JOB_BASE_URL/api/nurture/dispatch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "X-CRM-Cron-Contract: 2026-08-v2"
